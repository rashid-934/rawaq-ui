name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Least permissions: this workflow only reads the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA; the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's own commits, not the merge commit GitHub prepares.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Commits use a GitHub noreply address only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range="HEAD"
          if [ -n "$BASE" ]; then range="$BASE..HEAD"; fi
          allowed='^([0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com|noreply@github\.com)$'
          count=$(git log --format='%ae%n%ce' "$range" | sort -u | grep -vcE "$allowed" || true)
          if [ "$count" != "0" ]; then
            # The address itself is never printed: these logs are public.
            echo "$count author or committer address is not a GitHub noreply address."
            exit 1
          fi
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Format, lint, type check and unit tests
        run: yarn test
      - name: Build the package
        run: yarn build
