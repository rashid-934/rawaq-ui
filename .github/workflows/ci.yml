name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Least permissions: this workflow only reads the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA; the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own commits, not the merge commit GitHub prepares.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Commits use a GitHub noreply address only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range="HEAD"
          if [ -n "$BASE" ]; then range="$BASE..HEAD"; fi
          allowed='^([0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com|noreply@github\.com)$'
          count=$(git log --format='%ae%n%ce' "$range" | sort -u | grep -vcE "$allowed" || true)
          if [ "$count" != "0" ]; then
            # The address itself is never printed: these logs are public.
            echo "$count author or committer address is not a GitHub noreply address."
            exit 1
          fi
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Format, lint, type check and unit tests
        run: yarn test
      - name: Build the package
        run: yarn build
      - name: Check the built package
        run: yarn check:dist
      - name: The package stays within its size budget (+10 percent fails)
        run: yarn check:size
      - name: Nothing secret or private in the built package
        run: yarn scan:built dist
      - name: The starter installs this version
        run: yarn check:starter
      - name: The package can be packed
        run: yarn pack --dry-run

  storybook:
    name: storybook and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Build the Storybook
        run: yarn storybook:build
      # Every story, in English and Arabic, in all seven presets, with reduced motion, against
      # the WCAG 2.2 AA rules. It uses the Chrome that is already on the runner.
      - name: axe on every story
        run: yarn axe
      # Layout, target size, keyboard, 200 percent zoom, high contrast and right-to-left motion.
      - name: Comfort checks on every story
        run: yarn comfort
      - name: Nothing secret or private in the Storybook
        run: yarn scan:built storybook-static

  starter:
    name: starter and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Build and pack the package
        run: |
          yarn build
          yarn pack -o rawaq-ui-ci.tgz
      - name: Install the packed file into the starter
        working-directory: examples/starter
        run: |
          # In this work folder only: the starter in the repository keeps the release address.
          sed -i 's#"rawaq-ui": "[^"]*"#"rawaq-ui": "file:../../rawaq-ui-ci.tgz"#' package.json
          yarn install --no-immutable
      - name: Build the starter
        working-directory: examples/starter
        run: yarn build
      - name: Nothing secret or private in the starter's build
        run: yarn scan:built examples/starter/.next
      # Linux runners only, never macOS. The browsers come from Playwright's own download.
      - name: Install the test browsers
        run: yarn playwright install --with-deps chromium firefox webkit
      # Every page and every gallery page in English and Arabic: console, hydration, requests,
      # axe; the first painted frame in the saved look (Chromium). The tests start the starter.
      - name: Browser tests on Chromium, Firefox and WebKit
        env:
          E2E_BROWSERS: chromium,firefox,webkit
        run: yarn e2e
      # The processor slowed 4 times: load long tasks and the smooth gate, alone on the runner.
      - name: CPU 4x checks (Chromium)
        run: yarn e2e:perf
      - name: The numbers of the CPU 4x checks
        if: always()
        run: find e2e-results-perf -name numbers.json -exec cat {} + 2>/dev/null || true
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests
          path: |
            e2e-results
            e2e-results-perf
            e2e-report
            e2e-report-perf
          retention-days: 14
          if-no-files-found: ignore
