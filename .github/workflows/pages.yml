name: Storybook online

# Publishes the Storybook to GitHub Pages after a merge to main. Until the owner switches Pages
# on (Settings > Pages > Source: "GitHub Actions"), the first job says so and the rest is
# skipped, so the run stays green.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least permissions. Only the `deploy` job may publish to Pages. No secrets are used.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: is Pages switched on
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          source=$(gh api "repos/$REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not switched on with the source GitHub Actions: nothing to publish."
          fi

  build:
    name: build the Storybook
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA; the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn storybook:build
      # Nothing secret or private may go online: keys, email addresses, a client's name, folder
      # paths of a computer, source maps (scripts/scan-built.mjs). A finding stops the publish.
      - name: Scan what goes online
        run: yarn scan:built storybook-static
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
