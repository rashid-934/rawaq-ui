name: Release

# A tag such as v1.0.0 releases that version. The checks run first, then the packed file is
# attached to a GitHub Release, then the starter is installed and built from the released file.
# A released file is never replaced: a fix is a new version.
on:
  push:
    tags: ['v*']

# Least permissions. Only the `release` job may write, and only to add the release.
# No secrets are used: only the token GitHub gives each run.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: checks before the release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every action is pinned to a full commit SHA; the version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: The tag is the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match version $version in package.json."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md
      - name: Build and check the package
        run: |
          yarn build
          yarn check:dist
      - name: Pack
        run: yarn pack -o "rawaq-ui-$VERSION.tgz"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A version with a dash (1.0.0-rc.1) is a test release.
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" "rawaq-ui-$VERSION.tgz" \
            --title "Rawaq UI $VERSION" \
            --notes-file release-notes.md \
            --verify-tag $flags

  verify-release:
    name: verify the release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The starter installs this version
        run: node scripts/check-starter.mjs
      - name: Install the starter from the released file
        working-directory: examples/starter
        run: yarn install --no-immutable
      - name: Build the starter
        working-directory: examples/starter
        run: yarn build
