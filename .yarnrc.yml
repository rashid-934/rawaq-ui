# Dependencies may not run install scripts (supply-chain safety). Native binaries come from
# platform-specific optional packages instead. If a new package truly needs its build script,
# allow only that package with `dependenciesMeta: { <name>: { built: true } }` in package.json.
enableScripts: false

# No git dependencies may run build scripts.
approvedGitRepositories: []

nodeLinker: node-modules
